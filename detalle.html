<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle de Película</title>
  <link rel="stylesheet" href="./css/detalle.css">
</head>
<body>
  <div class="detalle-container">
    <button id="back-button" class="back-button">⬅ Volver</button>
    <img id="movie-image" src="" alt="Póster">
    <div class="detalle-info">
      <h1 id="movie-title"></h1>
      <p id="movie-description"></p>
      <p><strong>Actores:</strong> <span id="movie-actors"></span></p>
      <p><strong>Duración:</strong> <span id="movie-duration"></span></p>
      <p><strong>Año:</strong> <span id="movie-year"></span></p>
      <p><strong>Género:</strong> <span id="movie-genre"></span></p>
      <iframe id="movie-trailer" src="" allowfullscreen></iframe>
    </div>
  </div>

  <script src="./script/detalle.js"></script>
</body>
</html>
